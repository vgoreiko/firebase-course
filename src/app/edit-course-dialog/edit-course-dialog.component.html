<h2 mat-dialog-title>Edit Course</h2>

<article [formGroup]="form" mat-dialog-content>
    <mat-form-field>
        <input [formControl]="form.controls.description" matInput placeholder="Title">
    </mat-form-field>
    <mat-slide-toggle [formControl]="form.controls.promo" class="promo" color="primary">
        Course in promotion?
    </mat-slide-toggle>
    <mat-form-field>
        <textarea [formControl]="form.controls.longDescription" matInput placeholder="Description"></textarea>
    </mat-form-field>
</article>

<mat-dialog-actions>
    <button (click)="close()" mat-raised-button>
        Close
    </button>
    <button (click)="save()" mat-raised-button color="primary">
        Save
    </button>
</mat-dialog-actions>
